<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberGuard - Password Strength</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="cyber-grid"></div>
  
  <div class="container">
    <div class="card glass-panel">
      <div class="card-header">
        <h1 class="neon-title">CYBER<span>GUARD</span></h1>
        <p class="subtitle">Advanced Password Analytics</p>
      </div>

      <div class="input-group">
        <input type="password" id="password-input" placeholder="Enter your password..." autocomplete="off" />
        <button id="toggle-visibility" class="icon-btn" aria-label="Toggle visibility">
          <!-- SVG Eye Icon -->
          <svg id="eye-show" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          <svg id="eye-hide" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
        </button>
      </div>

      <div class="strength-section">
        <div class="strength-labels">
          <span id="strength-text">Awaiting Input...</span>
          <span id="score-text">0/100</span>
        </div>
        <div class="strength-meter">
          <div class="segment" id="seg-1"></div>
          <div class="segment" id="seg-2"></div>
          <div class="segment" id="seg-3"></div>
          <div class="segment" id="seg-4"></div>
        </div>
      </div>

      <div class="crack-time-panel">
        <div class="crack-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        </div>
        <div class="crack-info">
          <span class="label">Estimated Brute-Force Time</span>
          <span id="crack-time" class="time-value">Instant</span>
        </div>
      </div>

      <div class="requirements">
        <h3>Security Requirements</h3>
        <ul id="req-list">
          <li id="req-length" class="req-item"><div class="check-box"></div> At least 8 characters</li>
          <li id="req-lower" class="req-item"><div class="check-box"></div> Lowercase letter (a-z)</li>
          <li id="req-upper" class="req-item"><div class="check-box"></div> Uppercase letter (A-Z)</li>
          <li id="req-number" class="req-item"><div class="check-box"></div> Number (0-9)</li>
          <li id="req-symbol" class="req-item"><div class="check-box"></div> Special Character (!@#$...)</li>
        </ul>
      </div>

      <button id="generate-btn" class="neon-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 2v6h6"></path><path d="M21 12a9 9 0 1 0-9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path></svg>
        Generate Secure Password
      </button>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
